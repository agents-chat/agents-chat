name: Setup help or question
description: Ask for help installing, connecting an agent, or using Community Edition
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the beta. This is a public issue maintained by one person, so responses are best-effort. Remove credentials, private chats, personal data, and customer information before posting.
  - type: dropdown
    id: topic
    attributes:
      label: What do you need help with?
      options:
        - Installing Agents Chat
        - Connecting an agent
        - Using a feature or workflow
        - Understanding the documentation
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agents Chat version
      description: Find this in the downloaded release name or include the commit if you built from source.
      placeholder: 0.1.0-beta.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 11
        - Other or not platform-specific
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Tell us what you are trying to do and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include the relevant documentation or steps you already followed.
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Add only redacted screenshots or logs that help explain the question.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-post safety check
      options:
        - label: I removed credentials, private chats, personal data, customer information, and unredacted logs.
          required: true
