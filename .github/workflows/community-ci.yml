name: Community Edition CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  macos-community:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify immutable release artifact on release tags
        if: ${{ github.ref_type == 'tag' }}
        run: |
          # Pull requests and ordinary main pushes intentionally validate their
          # mutable source below. A public release marker describes immutable
          # published bytes, so it is enforced only for version tags.
          if [ -f .community-release.json ]; then
            python3 scripts/community/verify_release.py --artifact
          else
            echo "No release marker; development tree — skipping artifact verification."
          fi
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements.lock
          uv pip install --python .venv/bin/python --require-hashes -r requirements-dev.lock
      - name: Verify Python manifests match the lockfiles
        run: |
          .venv/bin/python - <<'PY'
          import re
          import sys
          from pathlib import Path

          PIN = re.compile(r"^([A-Za-z0-9_.-]+)(?:\[[^]]+\])?==([^;\\\s]+)")

          def normalized(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def direct_pins(path):
              pins = {}
              for raw in Path(path).read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line or line.startswith(("-r ", "--requirement ")):
                      continue
                  match = PIN.match(line)
                  if not match:
                      raise SystemExit(f"{path}: expected an exact name==version pin: {raw}")
                  pins[normalized(match.group(1))] = match.group(2)
              return pins

          def locked_versions(path):
              versions = {}
              for raw in Path(path).read_text(encoding="utf-8").splitlines():
                  match = PIN.match(raw.strip())
                  if match:
                      versions.setdefault(normalized(match.group(1)), set()).add(match.group(2))
              return versions

          problems = []
          for source, lock in (
              ("requirements.txt", "requirements.lock"),
              ("requirements.txt", "requirements-dev.lock"),
              ("requirements-dev.txt", "requirements-dev.lock"),
          ):
              locked = locked_versions(lock)
              for name, version in direct_pins(source).items():
                  if version not in locked.get(name, set()):
                      problems.append(f"{source}: {name}=={version} is not present in {lock}")

          if problems:
              print("\n".join(problems), file=sys.stderr)
              raise SystemExit(
                  "Regenerate and commit both Python lockfiles with the exact uv commands in CONTRIBUTING.md."
              )
          PY
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Verify release marker and secret gate
        run: .venv/bin/python scripts/community/verify_release.py --source
      - name: Validate shell launchers
        run: |
          # Every shipped *.sh and *.command, not just the installers: the
          # bridge launchers under scripts/ are shipped too, and .gitattributes
          # uses "* -text" so git never normalizes a contributor's line endings.
          # bash -n catches CRLF corruption as well as syntax errors. Quoted
          # "$script" keeps the spaces in the *.command names intact.
          status=0
          while IFS= read -r script; do
            bash -n "$script" || { echo "Shell syntax check failed: $script"; status=1; break; }
          done < <(find . -type d \( -name .git -o -name .venv -o -name node_modules \) -prune \
            -o -type f \( -name '*.sh' -o -name '*.command' \) -print)
          exit $status
      - name: Run Community source or public-export tests
        run: |
          if [ -f .community-release.json ]; then
            # The public repository is the export, so run every shipped test.
            .venv/bin/python -m pytest -q
          else
            # A maintainer tree also contains private-product tests that are not
            # part of Community Edition. Exercise every Community/build test here;
            # the fresh export receives the full shipped suite below.
            .venv/bin/python -m pytest -q tests/test_community_*.py tests/test_public_release_contract.py
          fi
      - name: Run frontend behavior tests
        run: npm test
      - name: Run Python type checks
        # The npm-distributed Pyright binary does not automatically discover a
        # uv-created virtual environment. Point it at the exact interpreter CI
        # just populated so third-party imports are checked, not reported as
        # spuriously missing.
        run: npm run typecheck -- --pythonpath .venv/bin/python
      - name: Build and fully test the exported Community tree
        run: |
          # tests/test_public_release_contract.py skips itself unless it sits in a
          # tree carrying .community-release.json. A public checkout was already
          # fully tested above; a maintainer checkout must build a fresh export and
          # run every shipped Python test inside it. The environment flag turns a
          # missing marker into a hard failure instead of a false-green skip.
          set -euo pipefail
          if [ -f .community-release.json ]; then
            AGENT_CHAT_REQUIRE_RELEASE_CONTRACT=1 \
              .venv/bin/python -m pytest -q tests/test_public_release_contract.py
          elif [ -f scripts/community/build_release.py ]; then
            tree="$(mktemp -d)/release"
            .venv/bin/python scripts/community/build_release.py --output "$tree"
            ( cd "$tree" && AGENT_CHAT_REQUIRE_RELEASE_CONTRACT=1 \
              "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q )
          else
            echo "::error::No release marker and no release builder; the public release contract cannot be proven."
            exit 1
          fi
      - name: Validate installer preflight
        run: |
          # The installer refuses to run anywhere but a cleared release package.
          # A development checkout has no marker, so it needs the explicit
          # dev-preflight opt-in -- which the installer only honours together
          # with --check-only, and which still refuses to copy anything.
          set -euo pipefail
          if [ -f .community-release.json ]; then
            scripts/community/install_macos.sh --check-only
          else
            AGENT_CHAT_ALLOW_DEV_INSTALL=1 scripts/community/install_macos.sh --check-only
          fi

  windows-community:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify immutable release artifact on release tags
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        run: |
          # Pull requests and ordinary main pushes validate mutable source.
          # Immutable published bytes are enforced only for version tags.
          if (Test-Path ".community-release.json") {
            python scripts\community\verify_release.py --artifact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No release marker; development tree - skipping artifact verification."
          }
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Install locked dependencies
        shell: pwsh
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv\Scripts\python.exe --require-hashes -r requirements.lock
          uv pip install --python .venv\Scripts\python.exe --require-hashes -r requirements-dev.lock
      - name: Verify release marker and secret gate
        run: .venv\Scripts\python.exe scripts\community\verify_release.py --source
      - name: Parse PowerShell release tools
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/community/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.File, $_.Message) }
            }
          }
          if ($failed) { exit 1 }
      - name: Run Community source or public-export tests
        shell: pwsh
        run: |
          if (Test-Path ".community-release.json") {
            # The public repository is the export, so run every shipped test.
            .venv\Scripts\python.exe -m pytest -q
          } else {
            # The macOS job covers the private release-builder tests and then
            # runs every test inside a fresh export.
            .venv\Scripts\python.exe -m pytest -q tests/test_community_config.py tests/test_community_agent_setup.py tests/test_community_runtime_tools.py tests/test_public_release_contract.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce the public release contract
        shell: pwsh
        run: |
          if (Test-Path ".community-release.json") {
            $env:AGENT_CHAT_REQUIRE_RELEASE_CONTRACT = "1"
            .venv\Scripts\python.exe -m pytest -q tests/test_public_release_contract.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No release marker; the macOS job builds a release tree and enforces the contract there."
          }
      - name: Validate installer preflight
        shell: pwsh
        run: |
          # Same rule as macOS: without a release marker the installer needs the
          # dev-preflight opt-in, which it honours only alongside -CheckOnly and
          # which never copies anything.
          if (-not (Test-Path ".community-release.json")) {
            $env:AGENT_CHAT_ALLOW_DEV_INSTALL = "1"
          }
          .\scripts\community\install_windows.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\Install Agents Chat on Windows.cmd' --check-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  secret-scan:
    # The release ships .gitleaks.toml, so CI has to actually run gitleaks against
    # it. Linux only: gitleaks is installed from a pinned, checksum-verified
    # release archive rather than a third-party action, and the Linux build is the
    # one this job needs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks
          gitleaks version
      - name: Scan for secrets with the shipped configuration
        run: |
          # A public release checkout has .gitleaks.toml at the root; a development
          # checkout still has the file it is built from. Never silently skip.
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            config=.gitleaks.toml
          elif [ -f community/gitleaks.public.toml ]; then
            config=community/gitleaks.public.toml
          else
            echo "::error::No gitleaks configuration found; secret scanning cannot be skipped."
            exit 1
          fi
          # --config replaces the built-in ruleset outright, so a configuration
          # that neither extends the default nor declares rules would scan with an
          # empty ruleset and pass every time. Refuse to report that as a clean run.
          if ! grep -Eq '^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true' "$config" \
             && ! grep -q '^\[\[rules\]\]' "$config"; then
            echo "::error::$config declares no [[rules]] and does not set useDefault = true under [extend], so gitleaks would scan with an empty ruleset and always pass."
            exit 1
          fi
          echo "Scanning with $config"
          gitleaks dir . --config "$config" --no-banner --redact=100 --verbose --exit-code 1
